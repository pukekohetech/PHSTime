<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Mensa Puzzle Iframe</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #e9e9e9;
      cursor: pointer;
    }

    button:hover {
      background: #dcdcdc;
    }

    .url {
      color: #444;
      word-break: break-all;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="newPuzzle" type="button">Load another puzzle</button>
    <a id="openLink" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
    <span id="currentUrl" class="url"></span>
  </div>

  <iframe id="puzzleFrame" title="Random Mensa Puzzle"></iframe>

  <script>
    const startDate = new Date(2024, 0, 1);

    function randomDateBetween(start, end) {
      const startMs = start.getTime();
      const endMs = end.getTime();
      const randomMs = startMs + Math.floor(Math.random() * (endMs - startMs + 1));
      const date = new Date(randomMs);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function buildPuzzleUrl(date) {
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const year = String(date.getFullYear()).slice(-2);
      return `https://mensa.org.uk/puzzle/${day}-${month}-${year}/`;
    }

    function loadRandomPuzzle() {
      const today = new Date();
      today.setHours(23, 59, 59, 999);

      const date = randomDateBetween(startDate, today);
      const url = buildPuzzleUrl(date);

      document.getElementById('puzzleFrame').src = url;
      document.getElementById('openLink').href = url;
      document.getElementById('currentUrl').textContent = url;
    }

    document.getElementById('newPuzzle').addEventListener('click', loadRandomPuzzle);
    loadRandomPuzzle();
  </script>
</body>
</html>
