<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PHS Brain Breaks</title>

  <!-- Base shared styling -->
  <link rel="stylesheet" href="styles.css">

  <!-- Activity modal + teacher styling -->
  <link rel="stylesheet" href="activities.css">

  <style>
    /* ===============================
       PAGE LAYOUT
    =============================== */
    .page-brain {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bgGrey);
      transition: background-color 400ms ease;
    }

    .page-brain .brainCard {
      margin-top: 70px;
    }

    .page-brain .appNav__btn[data-nav="brain"] {
      background: rgba(0,0,0,0.10);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.10);
    }

    .brainCard {
      width: min(820px, calc(100% - 28px));
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 20px;
    }

    .titleRow {
      display:flex;
      align-items:center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .title {
      font-weight: 950;
      font-size: 20px;
      margin: 0;
    }

    .stateChip {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.08);
      font-weight: 900;
      font-size: 12px;
    }

    .breakBtn {
      width:100%;
      padding: 24px;
      border-radius: 18px;
      border: 0;
      cursor: pointer;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
      text-align:center;
    }

    .breakName {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 950;
      margin:0;
    }

    .breakAssist {
      margin-top:10px;
      font-size:14px;
      font-weight:700;
      opacity:.75;
      white-space: pre-wrap;
    }

    .progressTrack {
      height:12px;
      border-radius:999px;
      background: rgba(0,0,0,0.12);
      overflow:hidden;
      margin: 16px 0;
    }

    .progressFill {
      height:100%;
      width:0%;
      background: rgba(0,0,0,0.25);
      transition: width 160ms linear;
    }

    .controlRow {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .miniRow {
      margin-top:12px;
      text-align:center;
      font-weight:900;
      font-size:13px;
    }
  </style>
</head>

<body class="page-brain">

  <!-- ===============================
       TOP NAV
  =============================== -->
  <nav class="appNav">
    <a class="appNav__btn" href="index.html" data-nav="index">⏲ Smart Board</a>
    <a class="appNav__btn" href="wheel.html" data-nav="wheel">🎡 Wheel</a>
    <a class="appNav__btn" href="timer.html" data-nav="timer">⏱ Timer</a>
    <a class="appNav__btn" href="noise.html" data-nav="noise">🔊 Noise</a>
    <a class="appNav__btn" href="brainbreak.html" data-nav="brain">🧠 Brain Breaks</a>
  </nav>

  <!-- ===============================
       OPTIONS MENU
  =============================== -->
  <div class="controls">
    <button id="optionsBtn">⚙️</button>

    <div id="optionsMenu" class="hidden">
      <div class="menuHeader">
        <div>
          <div class="menuTitle">Brain Break Options</div>
        </div>
        <button id="closeMenu">✕</button>
      </div>

      <div class="menuBody">

        <div class="menuRow">
          <button id="fullscreenBtn">Full screen</button>
          <button id="resetAllBtn" class="danger">Reset</button>
        </div>

        <div class="divider"></div>

        <details open>
          <summary>Include Activities</summary>
          <div id="includeList" style="margin-top:10px;"></div>
        </details>

        <details open>
          <summary>Teacher: Activities Editor</summary>
          <div id="teacherPanel" style="margin-top:10px;"></div>
        </details>

      </div>
    </div>
  </div>

  <!-- ===============================
       MAIN CARD
  =============================== -->
  <div class="brainCard">

    <div class="titleRow">
      <p class="title">Brain Break Assistant</p>
      <div id="stateChip" class="stateChip">READY</div>
    </div>

    <button class="breakBtn" id="breakBtn">
      <p id="breakName" class="breakName">Tap to pick a break</p>
      <div id="breakAssist" class="breakAssist">
        Click “Pick random” or press N
      </div>
    </button>

    <div class="progressTrack">
      <div id="progressFill" class="progressFill"></div>
    </div>

<div class="controlRow">
  <button id="pickBtn">Pick random</button>
  <button id="chooseBtn">Choose</button>
   <!-- ===============================
     <button id="startPauseBtn" disabled>Start</button>
  =============================== -->
  <button id="openBtn" class="hidden">Open</button>
  <button id="resetBtn">Reset</button>
</div>

    <div class="miniRow">
      Time left: <span id="timeLeft">--:--</span>
    </div>

  </div>

  <!-- Activity modal injected here -->
  <div id="modalHost"></div>

  <!-- ===============================
       SCRIPTS (ORDER MATTERS)
  =============================== -->
  <script src="activities.js"></script>
  <script src="brainbreak.js"></script>

</body>
</html>
